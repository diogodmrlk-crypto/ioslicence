<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IOSPRIVATE Keys</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section id="login" class="card login"><h1>IOSPRIVATE <span>Keys</span></h1><p>Controle de acessos</p><form id="loginForm"><input id="username" placeholder="Usuário" autocomplete="username" required><input id="password" type="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button><div id="loginMsg" class="msg"></div></form></section><section id="app" hidden><header><div><h1>IOSPRIVATE <span>Keys</span></h1><p>Controle de acessos</p></div><button id="logout" class="ghost">Sair</button></header><div id="stats" class="stats"></div><section class="toolbar"><input id="search" placeholder="Pesquisar por key ou usuário"><select id="filter"><option value="">Todos os status</option><option value="active">Ativas</option><option value="blocked">Bloqueadas</option><option value="revoked">Revogadas</option></select><button id="newKey">+ Criar key</button></section><div id="create" class="card create" hidden><h2>Nova licença</h2><form id="createForm"><input id="newUser" placeholder="Nome do usuário"><select id="newType"><option value="hourly">Por hora</option><option value="daily">Diária</option><option value="weekly">Semanal</option><option value="monthly">Mensal (30 dias)</option><option value="perm">Permanente</option></select><input id="duration" type="number" min="1" value="1" placeholder="Duração"><button>Gerar key</button><button type="button" id="cancel" class="ghost">Cancelar</button></form><pre id="generated"></pre></div><div id="msg" class="msg"></div><div class="tableWrap"><table><thead><tr><th>Key</th><th>Usuário</th><th>Status</th><th>Dispositivo</th><th>Expira em</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/app.js"></script></body></html>
